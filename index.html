<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#16181d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Night Racers · Bayview</title>
  </head>
  <body>
    <div id="game"></div>
    <canvas id="fx"></canvas>
    <div id="vignette"></div>
    <div id="flash"></div>

    <div id="hud">
      <div id="topLeft">
        <div class="chip money" id="money">$0</div>
        <div class="chip" id="rep">STREET REP 0</div>
        <div class="chip dim" id="weather">15:00 · CLEAR</div>
        <div class="chip dim hidden" id="fps"></div>
      </div>
      <div id="topRight">
        <canvas id="minimap"></canvas>
        <button id="pauseBtn" aria-label="Pause">II</button>
      </div>
      <div id="raceInfo" class="hidden">
        <div><span class="lbl">POS</span><span id="rPos">1/4</span></div>
        <div><span class="lbl">LAP</span><span id="rLap">1/2</span></div>
        <div><span class="lbl">TIME</span><span id="rTime">0:00.0</span></div>
      </div>
      <div id="cpArrow" class="hidden"></div>
      <div id="countdown" class="hidden"></div>
      <div id="toast" class="hidden"></div>
      <div id="hint" class="hidden"></div>
      <canvas id="speedo"></canvas>
    </div>

    <div id="controls"></div>
    <div id="editBar" class="hidden">
      <span>DRAG CONTROLS TO MOVE THEM</span>
      <label>SIZE <input id="editScale" type="range" min="0.6" max="1.6" step="0.05" value="1" /></label>
      <button id="editDone">DONE</button>
    </div>

    <div id="overlay" class="hidden"><div class="panel" id="panel"></div></div>
    <div id="loading"><div class="logo">NIGHT RACERS</div><small>Loading Bayview…</small></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
